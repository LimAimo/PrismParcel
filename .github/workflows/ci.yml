name: 自动测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查 JavaScript 语法
        run: npm run check
      - name: 执行编解码测试
        run: npm test
