name: 首次导入源码
on:
  push:
    paths:
      - '.prismparcel-source.br.b64'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '完成数据上传')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: 解压已审核的源码
        run: |
          python -m pip install --disable-pip-version-check brotli
          python - <<'PY'
          import base64, brotli, hashlib, io, tarfile
          from pathlib import Path
          data = base64.b64decode(Path('.prismparcel-source.br.b64').read_text())
          assert hashlib.sha256(data).hexdigest() == 'e30ee0d9952e97e41c7d345d49fbedfaf7e982c97aaa0d0ed91bd86ce316914b'
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(data))) as archive:
              archive.extractall('.', filter='data')
          Path('.prismparcel-source.br.b64').unlink()
          Path('.github/workflows/bootstrap.yml').unlink()
          PY
      - name: 测试源码
        run: |
          npm run check
          npm test
      - name: 生成 README 预览截图
        run: |
          python -m pip install --disable-pip-version-check playwright cryptography
          python -m playwright install --with-deps chromium
          export PRISM_CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          python tests/browser_smoke.py
      - name: 中文提交并上传完整源码
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "初始化 PrismParcel：导入 WinUI 3 重构版源码"
          git push origin HEAD:main
